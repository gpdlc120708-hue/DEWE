<!DOCTYPE html>
<html>
<head>
	<title>Pagina de Ejemplo</title>
	<style>
		body {
			background-image:url('https://shutterstock.com/image-vector/computer-icon-technology-pc-related-260nw-1661855074.jpg');

			background-size: 200px 200px; /* Tamaño de la imagen */
			background-position: 0 0; /* Posición Inicial */
			background-repeat: repeat; /* Repetir la imagen */
			color: #ffffff; /* Color de letra blanco */
			background-color: #000000; /* Color de fondo negro */
		}
		h1 {
			color: #ff0000; /* Color de letra rojo para títulos */
		}
	</style>
</head>
<body>
	<h1>Titulo de la pagina</h1>
	<p>Este es un parrafo de ejemplo.</p>
</body>
</html>
