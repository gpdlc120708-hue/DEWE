<!DOCTYPE html>
<html>
<head>
	<title>Mi pagina de Ejemplo</title>
	<style>
		body {
			background-image:url('https://www.vichaunter.org/wp-content/uploads/2016/03/pc-sobremesa.jpg');

			background-size: 200px 200px; /* Tamaño de la imagen */
			background-position: 0 0; /* Posición Inicial */
			background-repeat: repeat; /* Repetir la imagen */
			color: #ffff00; /* Color de letra amarillo */
			background-color: #000000; /* Color de fondo Amarillo Claro */
		}
		h1 {
			color: #0000ff; /* Color de letra azul para títulos */
		}
	</style>
</head>
<body>
	<h1>Titulo de la pagina</h1>
	<p>Este es un parrafo de ejemplo.</p>
</body>
</html>
